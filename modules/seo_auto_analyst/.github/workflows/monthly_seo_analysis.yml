name: SEO Monthly Automated Analysis

on:
  schedule:
    # Corre el día 1 de cada mes a las 08:00 UTC
    - cron: '0 8 1 * *'
  workflow_dispatch:
    # Permite ejecutarlo manualmente desde la pestaña Actions de GitHub

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib google-analytics-data google-generativeai gspread pandas tenacity functions-framework streamlit

      - name: Run SEO Analysis
        env:
          # Inyectamos los secretos desde GitHub
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          API_GEMINI: ${{ secrets.API_GEMINI }}
          
          # Cuentas de Google (Tokens)
          TOKEN_WAC_JSON: ${{ secrets.TOKEN_WAC_JSON }}
          TOKEN_WAC2_JSON: ${{ secrets.TOKEN_WAC2_JSON }}
          
          # Secreto del Cliente (Compartido para refrescar tokens)
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          
          # Configuración adicional
          PYTHONPATH: .
        run: |
          # Ejecutamos el motor directamente
          python cloud/main.py

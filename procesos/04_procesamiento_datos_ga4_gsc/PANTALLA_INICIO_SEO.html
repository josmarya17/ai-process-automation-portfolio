<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity SEO Dashboard</title>
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background: var(--card);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #94a3b8;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .command {
            background: #000;
            padding: 1rem;
            border-radius: 12px;
            font-family: 'Courier New', Courier, monospace;
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 2rem;
            border: 1px solid var(--secondary);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .command:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
        }
        .btn {
            background: linear-gradient(to right, var(--secondary), var(--primary));
            color: white;
            padding: 1rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            transition: transform 0.2s;
            box-shadow: 0 10px 15px -3px rgba(79, 172, 254, 0.4);
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Antigravity SEO</h1>
        <p>Tu asistente está listo para realizar el análisis de tus clientes. Solo copia y pega el comando en el chat de Antigravity:</p>
        
        <div class="command" onclick="copyToClipboard('/analizar [Nombre_del_Cliente]')">
            /analizar [Nombre_del_Cliente]
        </div>

        <p style="font-size: 0.9rem;">Haz clic en el comando para copiarlo.</p>

        <a href="#" class="btn" onclick="openChat()">IR AL CHAT DE ANTIGRAVITY</a>

        <div class="footer">
            WeAreContent | SEO Automation System v2.0
        </div>
    </div>

    <script>
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            alert("¡Comando copiado! Pégalo en el chat de Antigravity.");
        }
        function openChat() {
            // Intenta abrir el IDE o simplemente recuerda al usuario
            alert("Abre tu ventana de chat de Antigravity en este proyecto y pega el comando.");
        }
    </script>
</body>
</html>
